<!doctype html>

<html>

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="
      width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no
    "
  >

  <title>MyPandoc Presentation</title>

  <!-- Reveal.js -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/reveal.js@5/dist/reveal.css"
  >

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/reveal.js@5/dist/theme/white.css"
  >

  <!-- KaTeX -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css"
  >

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js-plugins@4.6.0/chalkboard/style.css">

  <!-- MyPandoc -->
  <link
    rel="stylesheet"
    href="styles.css"
  >
</head>


<body>

<div class="aidu-presentation-activity">
<div class="reveal aidu-presentation-activity__reveal">

  <div class="slides">

{{SLIDES}}

  </div>

</div>
</div>


<!-- -----------------------------------------------------------------------
     Slide menu
     -------------------------------------------------------------------- -->

<button
  id="slide-menu-button"
  type="button"
  aria-label="Slide menu"
  title="Slides (M)"
>
  ☰
</button>

<button type="button" class="aidu-presentation-chalkboard__button" aria-label="Toggle chalkboard" title="Chalkboard" onclick="window.RevealChalkboard?.toggleChalkboard()">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4.5h16v12H4zM8 20h8M12 16.5V20M7 8h10M7 11h6" /></svg>
</button>

<button type="button" class="aidu-presentation-print__button" aria-label="Print presentation or save as PDF" title="Print / save as PDF" onclick="MyPandocPrint.printRevealPresentation(Reveal).catch(error => console.error(error))">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 8V3.5h10V8M7 17H5a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M7 14h10v6.5H7zM17 11h.01" /></svg>
</button>

<div id="slide-menu">

  <div id="slide-menu-header">
    Slides
  </div>

  <div id="slide-menu-items">
  </div>

</div>


<!-- -----------------------------------------------------------------------
     Reveal.js
     -------------------------------------------------------------------- -->

<script
  src="https://cdn.jsdelivr.net/npm/reveal.js@5/dist/reveal.js">
</script>


<script src="https://cdn.jsdelivr.net/npm/reveal.js-plugins@4.6.0/chalkboard/plugin.js"></script>

<script>
Reveal.initialize({
  hash: true,
  controls: true,
  progress: true,
  center: false,
  slideNumber: false,
  transition: 'slide',
  plugins: [RevealChalkboard],
  chalkboard: { toggleChalkboardButton: false, toggleNotesButton: false }
});
</script>


<!-- -----------------------------------------------------------------------
     MyPandoc browser functionality
     -------------------------------------------------------------------- -->


<script src="reveal-menu.js"></script>
<script src="print.js"></script>

</body>

</html>
